name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Patch version in plugin header
        run: |
          sed -i "s/^Version: .*/Version: ${{ steps.version.outputs.version }}/" ericjohnsonguru.php

      - name: Patch stable tag in readme.txt
        run: |
          sed -i "s/^Stable tag: .*/Stable tag: ${{ steps.version.outputs.version }}/" readme.txt

      - name: Build zip
        run: |
          mkdir Eric-Johnson-Guru-WP-Plugin
          cp -r ericjohnsonguru.php readme.txt LICENSE plugin-update-checker Eric-Johnson-Guru-WP-Plugin/
          zip -r Eric-Johnson-Guru-WP-Plugin.zip Eric-Johnson-Guru-WP-Plugin/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Eric-Johnson-Guru-WP-Plugin.zip
          generate_release_notes: true
